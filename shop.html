<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متجر سراقة — التشكيلة الكاملة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* تنسيقات خاصة لتقليل الحجم وجعل التصميم محكم */
    .shop-page-container {
      max-width: 1250px;
      margin: 20px auto;
      padding: 0 4%;
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 25px;
    }

    .shop-sidebar {
      background: #11100e;
      padding: 18px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      height: fit-content;
      font-size: 13px;
    }

    .filter-block {
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 15px;
    }

    .filter-block h3 {
      font-size: 13px;
      color: #e6c687;
      margin-bottom: 10px;
      font-weight: 600;
    }

    .filter-input {
      width: 100%;
      padding: 7px 10px;
      background: #1a1917;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      border-radius: 6px;
      font-size: 12px;
    }

    .filter-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .filter-list label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      color: #ccc;
      font-size: 12px;
    }

    .filter-count {
      color: #777;
      font-size: 11px;
      margin-right: auto;
    }

    /* شريط أدوات الترتيب العلوي */
    .shop-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #11100e;
      padding: 10px 15px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 20px;
      font-size: 13px;
    }

    /* شبكة الكروت صغيرة الحجم (4 في السطر) */
    .products-grid-compact {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
    }

    .product-card-small {
      background: #11100e;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .product-card-small:hover {
      border-color: #e6c687;
      transform: translateY(-3px);
    }

    .product-card-small img {
      width: 100%;
      height: 160px;
      object-fit: contain;
      border-radius: 6px;
      background: #1a1917;
      margin-bottom: 8px;
    }

    .product-card-small h3 {
      font-size: 13px;
      color: #fff;
      margin: 5px 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .product-card-small .sub-text {
      font-size: 10px;
      color: #888;
      display: block;
      margin-bottom: 6px;
    }

    .product-card-small .price {
      font-size: 13px;
      color: #e6c687;
      font-weight: bold;
      display: block;
      margin-bottom: 8px;
    }

    /* أزرار الصفحات */
    .pagination {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 30px;
    }

    .page-num {
      width: 32px;
      height: 32px;
      background: #11100e;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
    }

    .page-num.active {
      background: #e6c687;
      color: #000;
      font-weight: bold;
    }

    @media (max-width: 992px) {
      .products-grid-compact { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 768px) {
      .shop-page-container { grid-template-columns: 1fr; }
      .products-grid-compact { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

  <!-- الشريط الإخباري المتحرك -->
  <div class="ticker-wrap">
    <div class="ticker-move">
      <div class="ticker-item">✨ صلِّ على النَّبيِّ المختار ﷺ ✨</div>
      <div class="ticker-item">💎 سراقة — جوهر الأناقة والرفاهية التي تُحس 💎</div>
      <div class="ticker-item">🚚 توصيل مجاني للطلبات أكثر من 1,500 جنيه 🚚</div>
    </div>
  </div>

  <!-- الهيدر الرئيسي -->
  <header class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="logo" style="display: inline-flex; align-items: center; gap: 8px;">
        <img src="image/S2.png" alt="SURAKA" style="height: 30px;">
        <span>SURAKA</span>
      </a>
      <nav class="desktop-nav">
        <a href="index.html">الرئيسية</a>
        <a href="shop.html" style="color:#e6c687;">المتجر</a>
      </nav>
      <div class="nav-actions">
        <button class="cart-btn" id="cartBtn">
          <svg viewBox="0 0 24 24"><path d="M4 5h2l1.7 10.2a2 2 0 0 0 2 1.8h7.9a2 2 0 0 0 1.9-1.5L21 8H7"></path><circle cx="10" cy="20" r="1"></circle><circle cx="18" cy="20" r="1"></circle></svg>
          <span class="cart-count" id="cartCount">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- جسم المتجر -->
  <main class="shop-page-container">

    <!-- الفلتر الجانبي -->
    <aside class="shop-sidebar" id="shopSidebar">
      <form id="productsFilterForm">
        
        <!-- البحث -->
        <div class="filter-block">
          <h3>البحث</h3>
          <input type="text" id="shopSearchInput" placeholder="اسم العطر..." class="filter-input">
        </div>

        <!-- نطاق السعر -->
        <div class="filter-block">
          <h3>نطاق السعر (جنيه)</h3>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
            <input type="number" id="minPrice" placeholder="الحد الأدنى" class="filter-input">
            <input type="number" id="maxPrice" placeholder="الحد الأقصى" class="filter-input">
          </div>
        </div>

        <!-- التصنيفات -->
        <div class="filter-block">
          <h3>التصنيف</h3>
          <ul class="filter-list">
            <li><label><input type="radio" name="category" value="all" checked> <span>الكل</span></label></li>
            <li><label><input type="radio" name="category" value="men"> <span>رجالي</span> <span class="filter-count">(12)</span></label></li>
            <li><label><input type="radio" name="category" value="women"> <span>نسائي</span> <span class="filter-count">(10)</span></label></li>
            <li><label><input type="radio" name="category" value="unisex"> <span>للجنسين</span> <span class="filter-count">(8)</span></label></li>
          </ul>
        </div>

        <!-- أجهزة وحجم الزجاجة -->
        <div class="filter-block">
          <h3>حجم الزجاجة</h3>
          <ul class="filter-list">
            <li><label><input type="checkbox" value="100Ml"> <span>100 مل</span></label></li>
            <li><label><input type="checkbox" value="50Ml"> <span>50 مل</span></label></li>
            <li><label><input type="checkbox" value="30Ml"> <span>30 مل</span></label></li>
          </ul>
        </div>

        <button type="button" id="applyFiltersBtn" class="btn btn-dark w-100" style="padding: 8px; font-size: 12px;">تطبيق الفلاتر</button>
        <button type="reset" id="clearFiltersBtn" class="btn btn-outline-light w-100" style="padding: 8px; font-size: 12px; margin-top: 6px;">إعادة ضبط</button>
      </form>
    </aside>

    <!-- المحتوى الرئيسي -->
    <section class="shop-main-content">
      
      <!-- شريط الأدوات العلوي -->
      <div class="shop-toolbar">
        <p style="margin: 0; color: #aaa;">عرض <strong>1–12</strong> من أصل <strong id="totalCount">30</strong> عطر</p>
        <div style="display:flex; align-items:center; gap:8px;">
          <label style="color:#aaa;">ترتيب حسب:</label>
          <select id="shopSortSelect" class="filter-input" style="width: auto; padding: 4px 8px;">
            <option value="recommended">الموصى به</option>
            <option value="price-low">السعر: من الأقل للأعلى</option>
            <option value="price-high">السعر: من الأعلى للأقل</option>
            <option value="newest">الأحدث</option>
          </select>
        </div>
      </div>

      <!-- شبكة الـ 12 عطر المحكمة صغيّرة الحجم -->
      <div class="products-grid-compact" id="fullShopGrid">
        <!-- يتم توليد الـ 12 كارت بحجم صغير عبر الـ JavaScript تلقائياً -->
      </div>

      <!-- أزرار الترقيم -->
      <div class="pagination" id="paginationControls">
        <button class="page-num active">1</button>
        <button class="page-num">2</button>
        <button class="page-num">3</button>
      </div>

    </section>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
