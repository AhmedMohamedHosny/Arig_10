<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سراقة — المتجر والتشكيلة الكاملة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Ticker Banner -->
  <div class="ticker-wrap">
    <div class="ticker-move">
      <div class="ticker-item">✨ صلِّ على النَّبيِّ المختار ﷺ ✨</div>
      <div class="ticker-item">💎 سراقة — جوهر الأناقة والرفاهية التي تُحس 💎</div>
      <div class="ticker-item">🚚 توصيل مجاني للطلبات أكثر من 1,500 جنيه 🚚</div>
    </div>
  </div>

  <!-- Navbar -->
  <header class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="logo" style="display: inline-flex; align-items: center; gap: 8px;">
        <img src="image/S2.png" alt="SURAKA" style="height: 35px; width: auto;">
        <span>SURAKA</span>
      </a>
      <nav class="desktop-nav">
        <a href="index.html">الرئيسية</a>
        <a href="shop.html" class="active" style="color: var(--gold, #c5a059);">المتجر</a>
      </nav>
      <div class="nav-actions">
        <button class="cart-btn" id="cartBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 5h2l1.7 10.2a2 2 0 0 0 2 1.8h7.9a2 2 0 0 0 1.9-1.5L21 8H7"></path>
            <circle cx="10" cy="20" r="1"></circle>
            <circle cx="18" cy="20" r="1"></circle>
          </svg>
          <span class="cart-count" id="cartCount">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Shop Container -->
  <main class="shop-page-container">
    <!-- Sidebar Filters -->
    <aside class="shop-sidebar">
      <div class="filter-group">
        <h3>البحث</h3>
        <input type="text" id="shopSearchInput" placeholder="اسم العطر..." class="filter-input">
      </div>

      <div class="filter-group">
        <h3>نطاق السعر (EGP)</h3>
        <div class="price-range-inputs">
          <input type="number" id="minPrice" placeholder="أقل سعر" class="filter-input">
          <input type="number" id="maxPrice" placeholder="أعلى سعر" class="filter-input">
        </div>
      </div>

      <div class="filter-group">
        <h3>التصنيف</h3>
        <label><input type="radio" name="shopCategory" value="all" checked> الكل</label><br>
        <label><input type="radio" name="shopCategory" value="men"> رجالي</label><br>
        <label><input type="radio" name="shopCategory" value="women"> نسائي</label><br>
        <label><input type="radio" name="shopCategory" value="unisex"> للجنسين</label>
      </div>

      <button id="applyFiltersBtn" class="btn btn-dark" style="width:100%;">تطبيق الفلترة</button>
      <button id="clearFiltersBtn" class="btn btn-outline-light" style="width:100%; margin-top:8px;">إعادة ضبط</button>
    </aside>

    <!-- Main Content Area -->
    <section class="shop-main-content">
      <div class="shop-header-status">
        <span id="productCountStatus">عرض 1–12 من العطور</span>
        <select id="shopSortSelect" class="filter-input" style="width: auto;">
          <option value="featured">الموصى به</option>
          <option value="price-low">السعر: من الأقل للأعلى</option>
          <option value="price-high">السعر: من الأعلى للأقل</option>
        </select>
      </div>

      <!-- Products Grid (12 Items) -->
      <div class="products-grid" id="fullShopGrid"></div>

      <!-- Pagination Buttons -->
      <div class="pagination" id="paginationControls"></div>
    </section>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
