<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم سراقة | SURAKA Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --main-bg: #0d2c24; --card-bg: #061914; --gold: #d4af37; --text: #f3efe7; }
    body { font-family: 'Cairo', sans-serif; background: var(--main-bg); color: var(--text); margin: 0; padding: 20px; }
    .admin-container { max-width: 1000px; margin: auto; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--gold); padding-bottom: 15px; margin-bottom: 25px; }
    h1, h2 { color: var(--gold); margin: 0; }
    .card { background: var(--card-bg); padding: 20px; border-radius: 8px; border: 1px solid rgba(212, 175, 55, 0.2); margin-bottom: 25px; }
    .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
    input, select, textarea { background: #12382e; border: 1px solid var(--gold); color: #fff; padding: 10px; border-radius: 4px; font-family: inherit; }
    .btn { background: var(--gold); color: #000; padding: 10px 20px; border: 0; font-weight: bold; cursor: pointer; border-radius: 4px; }
    .btn-danger { background: #e74c3c; color: #fff; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; }
    .product-item { background: #12382e; padding: 10px; border-radius: 6px; text-align: center; }
    .product-item img { width: 100%; height: 120px; object-fit: cover; border-radius: 4px; }
    .actions { display: flex; gap: 8px; justify-content: center; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="admin-container">
    <header>
      <h1>لوحة إدارة متجر سراقة</h1>
      <a href="index.html" class="btn">الرجوع للمتجر ➔</a>
    </header>

    <!-- تخصيص الألوان -->
    <div class="card">
      <h2>🎨 تخصيص ألوان الموقع</h2>
      <div style="display: flex; gap: 20px; margin-top: 15px;">
        <div class="form-group">
          <label>اللون الرئيسي (خلفية الموقع):</label>
          <input type="color" id="primaryColor" value="#0d2c24">
        </div>
        <div class="form-group">
          <label>اللون الذهبي (العناوين والأزرار):</label>
          <input type="color" id="goldColor" value="#d4af37">
        </div>
      </div>
    </div>

    <!-- إضافة / تعديل عطر -->
    <div class="card">
      <h2>✨ إضافة عطر جديد / تعديل</h2>
      <form id="perfumeForm" style="margin-top: 15px;">
        <div class="form-group">
          <label>اسم العطر:</label>
          <input type="text" id="pName" required>
        </div>
        <div style="display: flex; gap: 15px;">
          <div class="form-group" style="flex: 1;">
            <label>السعر (EGP):</label>
            <input type="number" id="pPrice" required>
          </div>
          <div class="form-group" style="flex: 1;">
            <label>القسم:</label>
            <select id="pCategory">
              <option value="men">رجالي</option>
              <option value="women">نسائي</option>
              <option value="unisex">للجنسين</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>رابط الصورة (URL أو اسم الملف داخل المجلد):</label>
          <input type="text" id="pImage" placeholder="example: image/S1.jpg" required>
        </div>
        <div class="form-group">
          <label>وصف العطر والنوتات:</label>
          <textarea id="pDesc" rows="3"></textarea>
        </div>
        <button type="submit" class="btn">حفظ العطر</button>
      </form>
    </div>

    <!-- قائمة العطور الحالية -->
    <div class="card">
      <h2>🛍️ العطور الموجودة حالياً</h2>
      <div class="grid" id="adminProductsGrid" style="margin-top: 15px;">
        <!-- يتم تحميل العطور هنا عبر JS -->
      </div>
    </div>
  </div>

</body>
</html>
